[project]
name = "RoboMage"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
pandas = "*"
matplotlib = "*"
pydantic = ">=2"
pytest = "*"
pytest-cov = "*"
pytest-asyncio = "*"
ruff = ">=0.14.0,<0.15"
mypy = "*"
sqlalchemy = "*"
pip = ">=25.2,<26"
scipy = ">=1.16.2,<2"
fastapi = ">=0.104.0"
uvicorn = ">=0.24.0"
requests = "*"
types-requests = "*"
pandas-stubs = "*"
dash = ">=2.14.0"
plotly = ">=5.17.0"
dash-bootstrap-components = ">=1.5.0"
h5py = "*"

[pypi-dependencies]
robomage = { path = ".", editable = true }
dash-cytoscape = ">=1.0.0"

[tasks]
test = "pytest -q"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src"
check = { depends-on = ["format-check", "lint", "typecheck", "test"] }
dashboard = "python -m robomage --dashboard"
dashboard-debug = "python -m robomage --dashboard --debug"

# Individual service tasks
peak-service = "python services/peak_analysis/main.py --port 8001"
workflow-service = "python services/workflow_engine/main.py --port 8002"

# Start all services for workflow system (cross-platform)
start-all = "python start_services.py"
